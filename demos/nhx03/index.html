
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHX-03 | Mirror Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">

            <div class="logo">NOCTI<span>HEX</span></div>

            <p class="eyebrow">NHX-03 // WEB SECURITY</p>

            <h1>Mirror Account</h1>

            <p class="description">
                Access the fictional employee portal.
                Investigate the profile records and
                discover the security weakness.
            </p>

            <div class="demo-notice">
                Educational simulation — fictional accounts only.
            </div>

            <form id="loginForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <p id="errorMessage" class="error" role="alert"></p>

                <button type="submit">ACCESS PORTAL</button>
            </form>

            <div class="credentials">
                <strong>Training Credentials</strong>
                <p>Username: tester</p>
                <p>Password: noctihex123</p>
            </div>

            <a href="../../index.html#challenges" class="back-link">
                ← Back to Challenges
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
